# KTPanel — otomatik veri tazeleme
#
# NE YAPAR: kaynaklardan çeker → DENETİMDEN GEÇİRİR → değiştiyse commit eder.
# Commit Vercel'i tetikler, deploy kendiliğinden olur.
#
# NEDEN GITHUB ACTIONS: Playwright (TEFAS için) Vercel serverless'ta koşmaz —
# §148'de ölçüldü. Actions'ta koşar. Ayrıca kullanıcının makinesi açık olmak
# zorunda kalmaz.
#
# KRİTİK: denetimden geçmeyen veri COMMIT EDİLMEZ. Sessizce bozuk veri
# yayınlamaktansa eski veriyle kalmak yeğdir — 29 Tem'de üç sessiz hata
# yakalandı (11 hisse eski fiyatta · 4 bayat analist hedefi · eksik çeyrek),
# üçü de "veri geldi" diyordu.

name: Veri Tazele

on:
  schedule:
    # Hafta içi 18:10 TSİ (15:10 UTC) — BIST kapanışından ~40 dk sonra
    - cron: '10 15 * * 1-5'
    # Hafta içi 09:10 TSİ (06:10 UTC) — §249n SABAH KOŞUSU, YALNIZ FON katmanı.
    # Fon fiyatı SABAH ilan edilir ve DÜNÜN değerlemesidir; akşam koşusu hep bir
    # gün geriden gelir. Bu koşu dünkü getiriyi aynı gün panele düşürür.
    # NOT: §249n 5 Ağu'da günlüğe "eklendi" diye yazılmıştı ama DOSYAYA HİÇ
    # GİRMEMİŞTİ — 10 Ağu tam okumasında yakalandı (§252x).
    - cron: '10 6 * * 1-5'
    # Cumartesi 07:00 TSİ — haftalık kalemler (risk metrikleri dahil;
    # vol ve beta 1 yıllık pencereden hesaplanır, günlük oynaması anlamsız)
    - cron: '0 4 * * 6'
  workflow_dispatch:        # elle tetikleme (Actions sekmesinden)
    inputs:
      katman:
        description: 'Hangi katman? (hepsi | fiyat | endeks | risk | fon)'
        required: false
        default: 'hepsi'

permissions:
  contents: write           # commit atabilmek için

concurrency:
  group: tazele
  cancel-in-progress: false # yarım kalmış tazeleme üstüne yenisi binmesin

jobs:
  tazele:
    runs-on: ubuntu-latest
    # SS326: 15 -> 20 dk. 19 Agu aksami is tavana carpip IPTAL oldu ve
    # "operation was canceled" hicbir teshis birakmadi. Iki katmanli koruma:
    # (1) tazele.mjs kendi 11 dk BUTCESINI tutar ve asarsa kalan katmanlari
    #     atlayip raporu YAZAR (yesil biter, eksikler gorunur);
    # (2) bu tavan yalniz son emniyet supabi - normalde ULASILMAZ.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5   # SS414: Node 20 deprecation - v5 Node 24 tabanli

      # §252x KATMAN ARTIK CRON'A GÖRE SEÇİLİYOR.
      # ÖNCE: `--katman="${{ github.event.inputs.katman || 'hepsi' }}"` —
      # inputs YALNIZ workflow_dispatch'te dolu olduğundan HER İKİ cron da
      # 'hepsi' koşuyordu. Cumartesi yorumu ("haftalık kalemler") ve
      # KURULUM.md'deki zamanlama tablosu bir ayrım TARİF EDİYORDU ama kodda
      # KARŞILIĞI YOKTU: risk katmanı her gün koşuyordu (141 gereksiz Yahoo
      # isteği/gün). github.event.schedule hiç kullanılmamıştı.
      # GÜVENLİ VARSAYILAN: tanınmayan/boş schedule -> 'hepsi' (eski davranış).
      - name: Katman seç
        id: sec
        run: |
          IN="${{ github.event.inputs.katman }}"
          SCH="${{ github.event.schedule }}"
          if   [ -n "$IN" ];                 then K="$IN"                # elle tetikleme
          elif [ "$SCH" = "10 6 * * 1-5" ];  then K="fon"                # 09:10 sabah
          elif [ "$SCH" = "10 15 * * 1-5" ]; then K="endeks,fiyat,fon"   # 18:10 akşam (risk YOK)
          elif [ "$SCH" = "0 4 * * 6" ];     then K="hepsi"              # cumartesi (risk DAHİL)
          else                                    K="hepsi"              # bilinmeyen -> eski davranış
          fi
          echo "katman=$K" >> $GITHUB_OUTPUT
          echo "seçilen katman: $K   (schedule='$SCH' · input='$IN')"

      - uses: actions/setup-node@v5   # SS414
        with:
          node-version: '22'   # SS326: Node 20 deprecation uyarisi (Actions zaten 24'e zorluyordu)

      # npm ci LOCK DOSYASI ister; yoksa düşer. İlk kurulumda lock yok.
      # continue-on-error: bağımlılık kurulmasa bile FİYAT ve ENDEKS katmanları
      # çalışır (onlar düz fetch kullanır, paket gerektirmez). Yalnız FON
      # katmanı Playwright'a bağlıdır ve o zaten kendi kontrolünü yapıyor.
      - name: Bağımlılıklar
        continue-on-error: true
        run: |
          # --omit=dev KULLANMA: playwright devDependencies'te duruyor ve
          # o bayrak onu ATLAR. İlk koşuda lock yoktu, npm install çalıştı,
          # playwright geldi. İkinci koşuda lock oluştu, npm ci --omit=dev
          # koştu ve playwright kurulmadı — fon katmanı sessizce atlandı.
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          node -e "try{require.resolve('playwright');console.log('✓ playwright hazır')}catch(e){console.log('⚠ playwright YOK — fon katmanı atlanacak')}"

      # Playwright yalnız FON katmanı için gerekli (TEFAS bot koruması).
      # Diğer katmanlar düz fetch ile çalışır; boşuna kurmayalım.
      # Playwright kurulumu düşerse diğer katmanlar yine koşsun.
      # §252x: koşul artık SEÇİLEN katmana bakıyor. Önceden github.event.inputs'a
      # bakıyordu ve scheduled koşuda o hep '' olduğundan Playwright HER koşuda
      # kuruluyordu — sabah fon koşusunda gerekli, ama endeks/risk koşusunda değil.
      - name: Playwright (yalnız fon katmanı)
        if: contains(steps.sec.outputs.katman, 'fon') || contains(steps.sec.outputs.katman, 'hepsi')
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      # Ne bulduğunu YAZ — ilk kurulumda en çok yol yapısı sorun çıkarır
      # DİKKAT: `[ -f x ] && echo` kalıbı, dosya YOKSA 1 döner. Döngünün son
      # turunda bu olursa adımın çıkış kodu 1 olur ve Actions işi ÖLDÜRÜR —
      # ilk koşuda tam bu oldu, teşhis adımı teşhis edeceği işi durdurdu.
      # `if/fi` kullanmak ve sona `exit 0` koymak sorunu kökten kapatır.
      - name: Yapıyı göster
        continue-on-error: true
        run: |
          echo "repo kökü:"; ls -1
          echo "---"
          for d in . ktpanel panel public; do
            if [ -f "$d/index.html" ]; then echo "index.html bulundu → $d"; fi
          done
          echo "---"
          for d in . ktpanel; do
            if [ -f "$d/xk100.json" ]; then echo "xk100.json bulundu → $d"; fi
            if [ -f "$d/multiple.json" ]; then echo "multiple.json bulundu → $d"; fi
          done
          exit 0

      - name: Tazele
        id: tazele
        continue-on-error: true
        run: node scripts/tazele.mjs --katman="${{ steps.sec.outputs.katman }}"
        env:
          TZ: Europe/Istanbul

      # Denetim raporu her koşuda görünsün — geçse de kalsa da
      - name: Denetim raporu
        if: always()
        run: cat rapor/son-tazeleme.md >> $GITHUB_STEP_SUMMARY || echo "rapor yok"

      - name: Commit ve deploy
        if: steps.tazele.outputs.degisti == '1'
        run: |
          git config user.name  "ktpanel-bot"
          git config user.email "bot@users.noreply.github.com"
          # İLK KOŞUDA node_modules commit edildi (.gitignore yoktu). Bir daha
          # olmasın diye önce indeksten düşürülür — .gitignore varsa zaten
          # eklenmez, yoksa bu satır kurtarır.
          git rm -r --cached node_modules --ignore-unmatch -q || true
          git add -A
          git commit -m "veri: ${{ steps.tazele.outputs.ozet }}"
          git push
          echo "✓ commit atıldı — Vercel deploy'u tetiklendi"

      - name: Değişiklik yok
        if: steps.tazele.outputs.degisti != '1'
        run: echo "Veri aynı ya da denetimden geçmedi — commit atılmadı."

      # Denetim düşerse iş KIRMIZI yansın ki bildirim gelsin
      - name: Denetim sonucu
        if: steps.tazele.outputs.denetim == 'basarisiz'
        run: |
          echo "::error::Denetim başarısız — veri yazılmadı. rapor/son-tazeleme.md'ye bak."
          exit 1

      # §306 KÖPRÜ TESTİ — yalnız Cumartesi koşusunda (haftalık sağlık turu).
      # Test PROD uçlarını çağırıp yanıt ŞEMASINI doğrular; §60/§92/§95-101'de
      # dört sessiz kırılma kullanıcı gözüyle yakalanmıştı, sistemle değil.
      # Test 13 Ağu'dan beri repoda duruyordu ama otomasyona bağlı DEĞİLDİ —
      # elle koşulmayan test, olmayan testtir (§243 sınıfı).
      # Commit adımından SONRA: köprü kırığı veri yazımını engellememeli.
      # CRON_SECRET tanımsızsa test atlanır — korumalı uçlara sırsız gitmek
      # 401 yağmuru ve ASILSIZ kırmızı üretir (uyarı enflasyonu yasağı).
      - name: Köprü testi (§306 · yalnız Cmt)
        if: always() && github.event.schedule == '0 4 * * 6'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET secret'ı tanımlı değil — köprü testi atlandı. Repo Settings → Secrets → CRON_SECRET ekleyin (Vercel'dekiyle aynı değer)."
            exit 0
          fi
          echo "## Köprü testi (§306)" >> $GITHUB_STEP_SUMMARY
          node ktpanel/test/kopru-testi.js 2>&1 | tee kopru-cikti.txt || KIRIK=1
          tail -30 kopru-cikti.txt | sed 's/\x1b\[[0-9;]*m//g' >> $GITHUB_STEP_SUMMARY
          if [ "$KIRIK" = "1" ]; then
            echo "::error::Köprü testinde KRİTİK uç bozuk — panel bir yedeğe düşmüş olabilir."
            exit 1
          fi
